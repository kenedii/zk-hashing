[package]
name = "argon2id-zk-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "argon2id-zk-cli"
path = "src/main.rs"

[dependencies]
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc"] }
base64 = "0.22.1"
bcrypt = { version = "=0.19.2", default-features = false }
miden-mast-package = { version = "=0.25.8" }
miden-core = { version = "=0.25.8" }
miden-core-lib = { version = "=0.25.8" }
miden-field = { version = "=0.28.1" }
miden-processor = { version = "=0.25.8" }
miden-vm = { version = "=0.25.8" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

# Native builds use the multi-threaded prover; WebAssembly stays single-threaded.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
miden-vm = { version = "=0.25.8", features = ["concurrent"] }

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.77"

[dev-dependencies]
hex = "0.4.3"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
