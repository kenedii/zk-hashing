steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/zk-hash-frontend', '-f', 'frontend/Dockerfile', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/zk-hash-frontend']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'zk-hash-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/zk-hash-frontend'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--project'
      - '$PROJECT_ID'
