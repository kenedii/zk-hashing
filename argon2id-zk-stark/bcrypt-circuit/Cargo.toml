[package]
name = "bcrypt_password_miden_circuit"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
miden = { version = "=0.14.0-rc.1" }

[dev-dependencies]
bcrypt = { version = "=0.19.2", default-features = false }

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
debug = 2
strip = false
