# Builds the site image and deploys it to the existing Cloud Run service.
# Run from the repository root:
#   gcloud builds submit --config deploy/cloudbuild.yaml --project coastal-run-510916-q0 .
substitutions:
  _SERVICE_NAME: zk-hash-frontend
  _REGION: us-central1
  _REPOSITORY: cloud-run-source-deploy

steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/Dockerfile
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:$BUILD_ID
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:latest
      - .

  - id: push-build-image
    name: gcr.io/cloud-builders/docker
    args: [push, $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:$BUILD_ID]

  - id: push-latest-image
    name: gcr.io/cloud-builders/docker
    args: [push, $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:latest]

  - id: deploy-cloud-run
    name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:$BUILD_ID
      - --region
      - $_REGION
      - --platform
      - managed
      - --port
      - "8080"
      - --max-instances
      - "1"
      - --allow-unauthenticated

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:$BUILD_ID
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:latest

timeout: 1200s
